<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}The Enchanted Library{% endblock %}</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>
        :root {
            --magic-bg: #080611;
            --magic-panel: #120d23;
            --magic-purple: #702bd1;
            --magic-light: #b982ff;
            --magic-border: #392052;
            --magic-text: #f5efff;
            --magic-muted: #b7a9ce;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(ellipse at 50% 0%, #21103e 0%, transparent 45%),
                var(--magic-bg);
            color: var(--magic-text);
            font-family: "Poppins", sans-serif;
        }

        a {
            color: var(--magic-light);
            text-decoration: none;
        }

        a:hover {
            color: #dfc4ff;
        }

        /* Navigation bar */
        .magic-navbar {
            position: relative;
            z-index: 1000;
            background: rgba(12, 8, 25, 0.97);
            border-bottom: 1px solid #49305e;
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.35);
            padding: 12px 0;
        }

        .magic-navbar .container {
            max-width: 1320px;
        }

        .magic-brand {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            color: #fff !important;
            font-family: "Cinzel", serif;
            font-size: clamp(17px, 2vw, 25px);
            font-weight: 700;
            white-space: nowrap;
        }

        .magic-logo {
            font-size: 34px;
            line-height: 1;
            filter: drop-shadow(0 0 8px #a855f7);
        }

        .magic-navbar .navbar-nav {
            gap: 8px;
        }

        .magic-navbar .nav-link {
            position: relative;
            color: #eee5ff;
            font-size: 14px;
            padding: 12px 14px !important;
            transition: color 0.25s ease;
        }

        .magic-navbar .nav-link:hover {
            color: var(--magic-light);
        }

        .magic-navbar .nav-link::after {
            content: "";
            position: absolute;
            left: 14px;
            right: 14px;
            bottom: 3px;
            height: 2px;
            background: var(--magic-light);
            transform: scaleX(0);
            transition: transform 0.25s ease;
        }

        .magic-navbar .nav-link:hover::after {
            transform: scaleX(1);
        }

        .magic-toggler {
            border: 1px solid var(--magic-border);
            padding: 7px 10px;
        }

        .magic-toggler:focus {
            box-shadow: 0 0 0 3px rgba(185, 130, 255, 0.2);
        }

        /* Purple buttons */
        .btn-magic {
            color: #fff !important;
            background: linear-gradient(135deg, #8139e6, #5420a9);
            border: 1px solid #8e4ce9;
            border-radius: 7px;
            padding: 9px 17px;
            font-size: 13px;
            font-weight: 500;
            box-shadow: 0 0 12px rgba(112, 43, 209, 0.12);
            transition: all 0.25s ease;
        }

        .btn-magic:hover {
            background: linear-gradient(135deg, #9957f4, #6c2acb);
            border-color: #c49aff;
            box-shadow: 0 0 20px rgba(157, 78, 221, 0.4);
            transform: translateY(-1px);
        }

        .btn-magic-outline {
            color: #e8d9ff !important;
            background: transparent;
            border: 1px solid #7446a5;
            border-radius: 7px;
            padding: 8px 14px;
            font-size: 13px;
        }

        .btn-magic-outline:hover {
            background: #25123d;
            border-color: var(--magic-light);
        }

        .magic-user {
            color: #e8d9ff;
            font-size: 13px;
        }

        /* Django messages */
        .magic-messages {
            position: relative;
            z-index: 20;
            max-width: 1320px;
            margin: 16px auto 0;
            padding: 0 20px;
        }

        .magic-messages .alert {
            border-radius: 8px;
        }

        /* Main content */
        main {
            min-height: 70vh;
        }

        /* General panels */
        .magic-panel {
            background: linear-gradient(145deg, #151027, #0e0
